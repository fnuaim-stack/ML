# Sweep AI Configuration
# https://docs.sweep.dev/configuration

# Enables Sweep on this repository
disabled: false

# Auto-expand tasks and sub-tasks
expand_tasks: true

# Use gpt-4 for better quality (default is gpt-3.5-turbo)
gpt4_disabled: true

# Number of retries for Sweep
retries: 3

# Default branch to create PRs against
default_branch: main
